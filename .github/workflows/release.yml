name: Launcher release

# Publishes the launcher for ARM64 Linux as release vVERSION (the version in
# launcher/Cargo.toml). The launcher holds no game files and no build
# scripts: on the device it fetches this repository's scripts and patches and
# builds the game from the player's own disc.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          command -v cargo || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and pack the launcher
        run: scripts/package-launcher.sh out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=out/FH1ReImagined-Launcher-linux-arm64.tar.gz
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Before the first drive

          You need your own Forza Horizon for Xbox 360: disc 1 as an ISO, plus the Title Update 4 package (tu00000001_00000000) if you have it. Horizon Rally, the 1000 Club and most online players need TU4. Keep about 35 GB free.

          - In Desktop Mode, unpack FH1ReImagined-Launcher-linux-arm64.tar.gz and open FH1ReImagined/fh1-launcher. Pick the ISO and the update, then press **Build**.
          - The disc is extracted once (about 8 GB) because ReImagined reads the game from a folder. The update is applied next to it. After that the ISO isn't needed.
          - The SDK and the recompiled game are compiled on the handheld, which takes a couple of hours: keep it on the charger. When it's done, "Forza Horizon ReImagined" appears in Steam without artwork (pick yours on SteamGridDB).

          This first stage runs ReImagined's emulated Xbox 360 GPU, so expect low frame rates. The settings are in game/forza.toml: 30 fps, the 3D scene at 540p, no MSAA and FSR 1. To play online on ReImagined's public server, uncomment live_server there.

          Launcher SHA-256: \`$sha256\`. No game files are included.
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$archive" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "$archive" --title "Forza Horizon ReImagined launcher $version for ARM64 Linux" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
