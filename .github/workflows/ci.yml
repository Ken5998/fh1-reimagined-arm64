name: ARM64 build

# Builds ReIGlue (the SDK Forza Horizon 1: ReImagined pins, plus
# patches/sdk) for linux-arm64 and compiles every ReImagined host source
# (plus patches/game) against it, two ways: natively on GitHub's ARM64 runner
# in a bare Fedora 44 (the release ArmadaOS is built on) with only the pinned
# toolchain, as the handheld does, and cross-compiled on x86-64 Ubuntu.
#
# No game files are involved, so the recompiled code (made from the player's
# disc on the handheld) is not built here: the host sources are compiled
# with upstream's tools/cmake/linux-host-check, which needs none.

on:
  # Every branch: work reaches main without pull requests, once this is green.
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      ref:
        description: ReImagined commit or branch (default the one in upstream.json)
        required: false

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 180
    steps:
      # No compilers, CMake or development files, as on ArmadaOS: the pinned
      # toolchain and sysroot bring them.
      - name: Install git, Python, the download tools and the desktop libraries
        run: >-
          dnf install -y --setopt=install_weak_deps=False git python3 curl tar xz findutils
          libX11 libX11-xcb libxcb libwayland-client
      - uses: actions/checkout@v5
      - name: Fetch the pinned toolchain
        run: scripts/fetch-toolchain.sh "$RUNNER_TEMP/toolchain"
      - name: Check out ReImagined and ReIGlue and patch them
        env:
          REF: ${{ inputs.ref }}
        run: scripts/prepare.sh "$RUNNER_TEMP/work" ${REF:+"$REF"}
      - name: Build and install the SDK
        run: |
          scripts/build-sdk.sh "$RUNNER_TEMP/work/reiglue" "$RUNNER_TEMP/toolchain" "$RUNNER_TEMP/sdk"
          "$RUNNER_TEMP/sdk/bin/rexglue" --help | head -n 20
      - name: Compile the host sources (Title Update 4)
        run: scripts/check-host.sh "$RUNNER_TEMP/work/reimagined" "$RUNNER_TEMP/toolchain" "$RUNNER_TEMP/sdk" 4
      - name: Check the Python tools build.sh runs
        run: |
          game="$RUNNER_TEMP/work/reimagined"
          python3 -I "$game/tools/xiso_extract.py" 2>&1 | grep -q "xiso_extract.py ISO extract"
          python3 -I "$game/tools/apply_title_update.py" 2>&1 | grep -q "BASE_XEX TITLE_UPDATE OUT_XEX"
      - name: Install DLC from a zip as downloaded
        run: |
          # A Xenia-style extracted package in a zip, like community packs ship.
          dir="$RUNNER_TEMP/dlc-dir" pkg=21D846F4D0EB47F4C4EB6892992F83429BBAD7D5
          mkdir -p "$dir/source/reimagined" "$RUNNER_TEMP/dlc/Pack/4D5309C9/00000002/$pkg/media"
          ln -s "$RUNNER_TEMP/work/reimagined/tools" "$dir/source/reimagined/tools"
          echo car > "$RUNNER_TEMP/dlc/Pack/4D5309C9/00000002/$pkg/media/car.zip"
          (cd "$RUNNER_TEMP/dlc" && python3 -m zipfile -c pack.zip Pack)
          python3 -I scripts/install-dlc.py --dir "$dir" "$RUNNER_TEMP/dlc/pack.zip"
          test -f "$dir/user/0000000000000000/4D5309C9/00000002/$pkg/media/car.zip"
          test -s "$dir/user/0000000000000000/4D5309C9/Headers/00000002/$pkg.header"
          python3 -I scripts/install-dlc.py --dir "$dir" --list | grep -q "1 DLC package installed"
          if python3 -I scripts/install-dlc.py --dir "$dir" README.md; then exit 1; fi
      - name: Check the start script, the settings and Add to Steam
        run: |
          bash -n config/forza.sh && bash -n scripts/build.sh
          python3 -c 'import tomllib; tomllib.load(open("config/forza.toml", "rb"))'
          mkdir -p "$RUNNER_TEMP/game" "$RUNNER_TEMP/home/.local/share/Steam/userdata/1/config"
          touch "$RUNNER_TEMP/game/forza.sh"
          HOME="$RUNNER_TEMP/home" python3 scripts/add-to-steam.py "$RUNNER_TEMP/game"
          test -s "$RUNNER_TEMP/home/.local/share/Steam/userdata/1/config/shortcuts.vdf"

  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install CMake, Ninja and wayland-scanner
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake ninja-build pkgconf libwayland-bin
      - uses: actions/checkout@v5
      - name: Fetch the pinned toolchain
        run: scripts/fetch-toolchain.sh "$RUNNER_TEMP/toolchain"
      - name: Check out ReImagined and ReIGlue and patch them
        env:
          REF: ${{ inputs.ref }}
        run: scripts/prepare.sh "$RUNNER_TEMP/work" ${REF:+"$REF"}
      - name: Build and install the SDK
        run: scripts/build-sdk.sh "$RUNNER_TEMP/work/reiglue" "$RUNNER_TEMP/toolchain" "$RUNNER_TEMP/sdk"
      - name: Compile the host sources (disc version)
        run: scripts/check-host.sh "$RUNNER_TEMP/work/reimagined" "$RUNNER_TEMP/toolchain" "$RUNNER_TEMP/sdk" 0

  launcher:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust, and a virtual screen with OpenGL for the window
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6
          command -v cargo || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Test and build the launcher
        run: |
          cargo test --release --locked --manifest-path launcher/Cargo.toml
          scripts/package-launcher.sh out
          tar -tzvf out/FH1ReImagined-Launcher-linux-arm64.tar.gz
      - name: Open the launcher window
        run: |
          # Still open after 10 seconds (timeout ends it with 124): it started.
          status=0
          HOME="$RUNNER_TEMP/home" xvfb-run -a -s "-screen 0 860x700x24" \
            timeout 10 launcher/target/release/fh1-launcher || status=$?
          test "$status" = 124
